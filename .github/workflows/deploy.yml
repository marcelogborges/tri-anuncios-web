name: Deploy Web

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-2
      ECR_REGISTRY: 271376211201.dkr.ecr.us-east-2.amazonaws.com
      ECR_REPOSITORY: tri-anuncios-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_WEB_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-2 | \
              docker login --username AWS --password-stdin 271376211201.dkr.ecr.us-east-2.amazonaws.com

            docker pull 271376211201.dkr.ecr.us-east-2.amazonaws.com/tri-anuncios-web:latest

            docker stop tri-anuncios-web 2>/dev/null || true
            docker rm tri-anuncios-web 2>/dev/null || true

            docker run -d \
              --name tri-anuncios-web \
              --restart always \
              -p 3000:3000 \
              271376211201.dkr.ecr.us-east-2.amazonaws.com/tri-anuncios-web:latest

            sleep 5
            curl -sf http://localhost:3000 || (echo "Health check failed" && exit 1)
