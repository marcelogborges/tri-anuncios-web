name: Deploy Web

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-2
      ECR_REGISTRY: 271376211201.dkr.ecr.us-east-2.amazonaws.com
      ECR_REPOSITORY: tri-anuncios-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_WEB_HOST }} >> ~/.ssh/known_hosts

      - name: Copy config to EC2
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_WEB_HOST }} "mkdir -p ~/app"
          scp -i ~/.ssh/deploy_key infra/docker-compose.yml ubuntu@${{ secrets.EC2_WEB_HOST }}:~/app/docker-compose.yml

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_WEB_HOST }} bash << 'ENDSSH'
          set -e

          aws ecr get-login-password --region us-east-2 | \
            docker login --username AWS --password-stdin 271376211201.dkr.ecr.us-east-2.amazonaws.com

          cd ~/app
          docker compose pull
          docker compose up -d

          for i in $(seq 1 12); do
            curl -sf http://localhost:3000 && exit 0
            sleep 5
          done
          echo "Health check failed after 60s" && exit 1
          ENDSSH
